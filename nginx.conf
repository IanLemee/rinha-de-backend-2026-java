worker_processes 1;
worker_rlimit_nofile 8192;

events {
    worker_connections 512;
    multi_accept on;
    use epoll;
}

http {
    access_log off;

    upstream api {

       server api:9999 max_fails=0;
       server api1:9999 max_fails=0;
       keepalive 32;
    }

    server {
       listen 9999;
       location / {
          proxy_pass http://api;
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_buffering off;
          proxy_request_buffering off;
          proxy_socket_keepalive on;
       }
    }
}