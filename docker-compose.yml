services:
  api: &api
    image: ianlemee/rinha-backend-brute-force:latest
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: "120MB"
    depends_on:
      - postgres
    networks:
      - db
    environment:
      - JAVA_TOOL_OPTIONS=-Xms80m -Xmx80m -XX:+UseSerialGC -XX:MaxMetaspaceSize=32m

  api1:
    <<: *api

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "0.0.0.0:9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
      - api1
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20MB"
    networks:
      - db

  postgres:
    image: pgvector/pgvector:pg16
    command: postgres -c shared_buffers=24MB -c work_mem=4MB -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./references.csv.gz:/docker-entrypoint-initdb.d/references.csv.gz
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "90MB"
    networks:
      - db

networks:
  db: