services:
  api: &api
    image: ianlemee/rinha-backend-brute-force:latest
#    deploy:
#      resources:
#        limits:
#          cpus: "0.35"
#          memory: "160MB"

  api1:
    <<: *api
  api2:
    <<: *api

  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api1
      - api2
    cpuset: "0,2"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "30M"