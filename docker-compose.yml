services:
  api: &api
    image: ianlemee/rinha-backend-brute-force:latest
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: "130MB"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db
    environment:
      - JAVA_TOOL_OPTIONS=-Xms64m -Xmx64m -XX:MaxMetaspaceSize=64m -XX:+UseSerialGC -Xss256k

  api1:
    <<: *api

  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api
      - api1
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "10MB"
    networks:
      - db

  postgres:
    image: pgvector/pgvector:pg16
    command: postgres -c shared_buffers=24MB -c work_mem=4MB -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./references.csv.gz:/docker-entrypoint-initdb.d/references.csv.gz
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "80MB"
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

networks:
  db: